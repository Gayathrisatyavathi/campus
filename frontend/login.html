<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In • Campus Management Protocol</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-body">
  <div class="auth-shell"><a class="brand" href="/"><span class="brand-mark">CP</span><span>Campus Management Protocol</span></a>
    <div class="auth-card">
      <div class="eyebrow">WELCOME BACK</div><h1>Sign in to your career hub.</h1><p>Access placements, training, AI skills, interviews and your student profile.</p>
      <form id="login-form">
        <label>Email<input type="email" name="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required placeholder="••••••••"></label>
        <button class="btn primary full" type="submit">Sign In <span>→</span></button>
      </form>
      <div class="auth-links"><a href="#" id="forgot">Forgot Password?</a><a href="/register.html">Create Account</a></div>
      <div id="form-message" class="form-message"></div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
